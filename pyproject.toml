[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athletics-loader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "pdfplumber>=0.11",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
